services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    restart: unless-stopped
    ports:
      - "8890:8890/udp"   # SRT ingest
      - "1935:1935"       # RTMP fallback ingest
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

  shotter:
    build: ./shotter
    container_name: shotter
    restart: unless-stopped
    environment:
      - OVERLAY_URL=${OVERLAY_URL}
      - SHOT_MS=1000
    volumes:
      - shared:/shared

  burner:
    build: ./burner
    container_name: burner
    restart: unless-stopped
    depends_on:
      - mediamtx
    environment:
      - INPUT_URL=rtmp://mediamtx:1935/live
      - CF_RTMPS_URL=${CF_RTMPS_URL}
      - CF_STREAM_KEY=${CF_STREAM_KEY}
    volumes:
      - shared:/shared

  gc-poller:
    build: ./gc-poller
    container_name: gc-poller
    restart: unless-stopped
    environment:
      - POLLER_TOKEN=${POLLER_TOKEN}
      - TEAM=u15
      - LOCAL_TOKEN_FILE=/shared-token/gctoken.json
      - LIVE_POLL_MS=1500          # scorebug refresh cadence while live
      - FETCH_TIMEOUT_MS=2500      # abandon a hung GC call instead of stalling a tick
      # Test hook: point at a completed GC game id to replay it as if live.
      - FORCE_EVENT_ID=${FORCE_EVENT_ID:-}
    volumes:
      - gctoken:/shared-token:ro

  # Browserless token refresher: calls eden /auth {type:"refresh"} on a timer to
  # keep a fresh user gc-token in the gctoken volume for the poller. No Chrome —
  # immune to the web-app-render timeouts that made the old puppeteer minter
  # flaky (and leak Chrome). Seeded once by seed-login.js (writes ./gc-auth/
  # state.json, which holds the ~14-day rotating refresh token + app clientKey).
  # If the refresh token dies (>14d idle / revoked) it backs off and logs a
  # re-seed request; the poller rides its 60-min token TTL then degrades to
  # Tier-1. Re-seed: run seed-login.js (needs an emailed code). mint-token.js /
  # mint-loop.js remain in the image as a manual trusted-device fallback.
  token-refresher:
    container_name: token-refresher
    restart: unless-stopped
    image: node:22-slim
    user: root                       # writes the gctoken volume + ./gc-auth state
    environment:
      - STATE_FILE=/state/state.json
      - TOKEN_OUT=/shared-token/gctoken.json
      - REFRESH_SKEW_MIN=15          # refresh when the access token is 15min from expiry
    entrypoint: ["node", "/app/refresh-loop.js"]
    working_dir: /app
    volumes:
      - ./gc-poller:/app:ro
      - gctoken:/shared-token
      - ./gc-auth:/state             # durable refresh-token + constants (chmod 600, NOT in git)

volumes:
  shared:
  gctoken:
