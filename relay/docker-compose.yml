services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    restart: unless-stopped
    ports:
      - "8890:8890/udp"   # SRT ingest
      - "1935:1935"       # RTMP fallback ingest
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

  shotter:
    build: ./shotter
    container_name: shotter
    restart: unless-stopped
    environment:
      - OVERLAY_URL=${OVERLAY_URL}
      - SHOT_MS=1000
    volumes:
      - shared:/shared

  burner:
    build: ./burner
    container_name: burner
    restart: unless-stopped
    depends_on:
      - mediamtx
    environment:
      - INPUT_URL=rtmp://mediamtx:1935/live
      - CF_RTMPS_URL=${CF_RTMPS_URL}
      - CF_STREAM_KEY=${CF_STREAM_KEY}
    volumes:
      - shared:/shared

  gc-poller:
    build: ./gc-poller
    container_name: gc-poller
    restart: unless-stopped
    environment:
      - POLLER_TOKEN=${POLLER_TOKEN}
      - TEAM=u15
      - LOCAL_TOKEN_FILE=/shared-token/gctoken.json
      - LIVE_POLL_MS=1500          # scorebug refresh cadence while live
      - FETCH_TIMEOUT_MS=2500      # abandon a hung GC call instead of stalling a tick
      # Test hook: point at a completed GC game id to replay it as if live.
      - FORCE_EVENT_ID=${FORCE_EVENT_ID:-}
    volumes:
      - gctoken:/shared-token:ro

  # Trusted-device token minter: re-logs into web.gc.com every ~10min using the
  # seeded Chrome profile (no emailed code needed once seeded — see
  # gc-poller/seed-login.js) and writes a fresh gc-token for the poller.
  # NOTE: a GC-side outage can break the token refresh briefly → the poller
  # degrades to Tier-1 (score/inning only, no count/cards) until the next mint.
  token-minter:
    container_name: token-minter
    restart: unless-stopped
    image: ghcr.io/puppeteer/puppeteer:24
    user: root            # needs to write the named volume + the profile dir
    environment:
      - GC_EMAIL=${GC_EMAIL}
      - GC_PASSWORD=${GC_PASSWORD}
      - NODE_PATH=/home/pptruser/node_modules
      - PUPPETEER_CACHE_DIR=/home/pptruser/.cache/puppeteer
      - PROFILE_DIR=/profile
      - TOKEN_OUT=/shared-token/gctoken.json
      - MINT_INTERVAL_MIN=10
    entrypoint: ["node", "/app/mint-loop.js"]
    working_dir: /app
    volumes:
      - ./gc-poller:/app:ro
      - gctoken:/shared-token
      - ./gc-profile:/profile

volumes:
  shared:
  gctoken:
