name = "canonniers-library-worker"
main = "src/index.js"
compatibility_date = "2026-05-12"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "canonniers-db"
database_id = "f416f91e-a004-4bdb-a6bf-d4ba3264e61d"

[[r2_buckets]]
binding = "LIBRARY"
bucket_name = "player-photos-library"

[[r2_buckets]]
binding = "GALLERY"
bucket_name = "player-photos"          # for assign-player copy (headshots → public bucket)

[[r2_buckets]]
binding = "CARDS_BUCKET"
bucket_name = "canonniers-cards"       # for D07 generate-cutout: cutouts/{uuid}.png is publicly reachable at cards.canonniersdequebec.ca (no auth gate, Puppeteer can fetch)

# Service binding to canonniers-claude-proxy for /removebg subrequest.
# Same-account workers cannot fetch each other via *.workers.dev (CF error 1042);
# service binding routes the call internally.
[[services]]
binding = "PROXY"
service = "canonniers-claude-proxy"

# Secrets set via: wrangler secret put <NAME>
# LIBRARY_TOKEN          — random hex secret; same value in admin-photo-library.html + admin-roster.html
# CF_IMAGES_TOKEN        — CF Images API token (same as photo-worker CF_IMAGES_TOKEN)
# CF_ACCOUNT_ID          — Cloudflare account ID: db90db1d80338194e2994306da649f90
