<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <title>Canonniers — Matchday Hype</title>
  <style>
    :root {
      --canvas-w: 1080px;
      --canvas-h: 1080px;

      --navy-900: #04080F;
      --navy-800: #0A1628;
      --navy-700: #0F1F3A;
      --navy-600: #14294A;
      --navy-500: #1B355F;

      --cyan:       #38BDF8;
      --cyan-soft:  rgba(56, 189, 248, 0.55);
      --cyan-glow:  rgba(56, 189, 248, 0.45);
      --sky:        #A8D6F0;
      --orange:     #F39C5B;

      --platinum:   #E8EEF7;
      --text:       #FFFFFF;
      --text-mute:  rgba(232, 238, 247, 0.72);

      --font-display: 'Barlow Condensed', 'Helvetica Neue', sans-serif;
      --font-mono:    ui-monospace, 'SF Mono', Menlo, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: var(--canvas-w);
      height: var(--canvas-h);
      overflow: hidden;
      background: #05080E;
      font-family: var(--font-display);
      color: var(--text);
    }

    .canvas {
      width: var(--canvas-w);
      height: var(--canvas-h);
      position: relative;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(120% 80% at 30% 20%, rgba(56, 189, 248, 0.08) 0%, transparent 55%),
        radial-gradient(140% 100% at 50% 60%, var(--navy-700) 0%, var(--navy-800) 50%, var(--navy-900) 100%);
    }

    /* ============= CONCRETE WALL TEXTURE ============= */
    .concrete {
      position: absolute; inset: 0; z-index: 0; pointer-events: none;
      opacity: 0.45;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><filter id='c'><feTurbulence type='fractalNoise' baseFrequency='0.035' numOctaves='3' seed='7' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.65  0 0 0 0 0.7  0 0 0 0 0.82  0 0 0 0.9 0'/></filter><rect width='100%25' height='100%25' filter='url(%23c)'/></svg>");
      background-size: 600px 600px;
    }
    .concrete-streaks {
      position: absolute; inset: 0; z-index: 0; pointer-events: none;
      opacity: 0.18;
      background:
        repeating-linear-gradient(91deg,
          rgba(0,0,0,0.4) 0px,
          rgba(0,0,0,0.4) 1px,
          transparent 1px,
          transparent 9px),
        repeating-linear-gradient(180deg,
          rgba(255,255,255,0.05) 0px,
          rgba(255,255,255,0.05) 1px,
          transparent 1px,
          transparent 5px);
      mix-blend-mode: overlay;
    }
    .grain {
      position: absolute; inset: 0; z-index: 1; pointer-events: none;
      opacity: 0.30;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.7  0 0 0 0 0.78  0 0 0 0 0.9  0 0 0 0.55 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    }
    .vignette {
      position: absolute; inset: 0; z-index: 9; pointer-events: none;
      background: radial-gradient(120% 90% at 50% 50%, transparent 60%, rgba(0,0,0,0.55) 100%);
    }

    /* ============= PAINT DRIPS (top edge) ============= */
    .drips { position: absolute; inset: 0 0 auto 0; height: 220px; z-index: 2; pointer-events: none; }
    .drips svg { width: 100%; height: 100%; }

    /* ============= STICKERS (lower left) ============= */
    .stickers {
      position: absolute;
      left: 50px; bottom: 220px;
      z-index: 5;
      display: flex; flex-direction: column; gap: 18px;
      pointer-events: none;
    }
    .sticker {
      width: 100px; height: 100px;
      border-radius: 50%;
      display: grid; place-items: center;
      background: linear-gradient(155deg, rgba(255,255,255,0.10), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.30),
        0 14px 28px rgba(0,0,0,0.55),
        0 0 20px rgba(56,189,248,0.18);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      position: relative;
      transform: rotate(-4deg);
    }
    .sticker.alt { transform: rotate(5deg); }
    .sticker.alt2 { transform: rotate(-7deg); }
    .sticker img {
      width: 70%; height: 70%; object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.45));
    }
    .sticker .glyph {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 52px;
      color: var(--cyan);
      text-shadow: 0 0 14px rgba(56,189,248,0.6);
    }
    .sticker .tag {
      position: absolute;
      bottom: -10px;
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 3px;
      color: var(--cyan);
      background: var(--navy-900);
      padding: 4px 8px;
      border: 1px solid rgba(56,189,248,0.4);
      text-transform: uppercase;
      white-space: nowrap;
      transform: rotate(4deg);
    }

    /* ============= CUTOUT LAYER ============= */
    .cutout-layer { position: absolute; inset: 0; z-index: 6; pointer-events: none; }
    .cutout {
      position: absolute;
      filter:
        drop-shadow(0 0 24px rgba(56,189,248,0.40))
        drop-shadow(0 0 60px rgba(56,189,248,0.18))
        drop-shadow(0 28px 40px rgba(0,0,0,0.65));
    }

    /* ============= RIGHT-SIDE COPY STACK ============= */
    .copy {
      position: absolute;
      top: 200px;
      right: 60px;
      width: 580px;
      z-index: 7;
      display: flex; flex-direction: column;
      gap: 18px;
      text-align: right;
    }

    .hype-label {
      align-self: flex-end;
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 6px;
      color: var(--cyan);
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(56,189,248,0.55);
      display: flex; align-items: center; gap: 10px;
    }
    .hype-label .dot { width: 7px; height: 7px; border-radius: 999px; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
    .hype-label .bar { width: 36px; height: 1px; background: linear-gradient(90deg, transparent, var(--cyan)); }

    .headline {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 108px;
      line-height: 0.92;
      letter-spacing: -1px;
      text-transform: uppercase;
      color: var(--text);
      text-shadow:
        -3px 0 0 #000, 3px 0 0 #000,
        0 -3px 0 #000, 0 3px 0 #000,
        -3px -3px 0 #000, 3px -3px 0 #000,
        -3px  3px 0 #000, 3px  3px 0 #000,
        0 12px 24px rgba(0,0,0,0.55);
    }
    .headline .bang {
      color: var(--cyan);
      text-shadow:
        -3px 0 0 #000, 3px 0 0 #000,
        0 -3px 0 #000, 0 3px 0 #000,
        -3px -3px 0 #000, 3px -3px 0 #000,
        -3px  3px 0 #000, 3px  3px 0 #000,
        0 0 30px rgba(56,189,248,0.7);
    }

    .matchup {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 52px;
      line-height: 1;
      letter-spacing: 0;
      text-transform: uppercase;
      color: var(--platinum);
      text-shadow: 0 4px 12px rgba(0,0,0,0.55);
    }
    .matchup .vs {
      color: var(--cyan);
      margin: 0 4px;
      text-shadow: 0 0 14px rgba(56,189,248,0.6);
    }

    .underline-stroke {
      align-self: flex-end;
      width: 280px; height: 6px;
      background: linear-gradient(90deg, transparent, var(--cyan));
      box-shadow: 0 0 14px rgba(56,189,248,0.55);
      margin-top: -6px;
    }

    .info-stack {
      margin-top: 8px;
      display: flex; flex-direction: column; gap: 4px;
      align-items: flex-end;
    }
    .info-stack .venue {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 38px;
      line-height: 1;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text);
      text-shadow: 0 2px 8px rgba(0,0,0,0.55);
    }
    .info-stack .when {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 56px;
      line-height: 1;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #FFFFFF 0%, #C8D2E0 60%, #8C99B3 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
    }

    /* ============= BRAND LOCKUP bottom-right ============= */
    .brand-lockup {
      position: absolute;
      bottom: 50px; right: 50px;
      z-index: 8;
      display: flex; align-items: center; gap: 12px;
      padding: 14px 18px;
      background: linear-gradient(155deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 8px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.20),
        0 10px 28px rgba(0,0,0,0.5);
    }
    .brand-lockup img {
      width: 56px; height: 56px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.45));
    }
    .brand-lockup .brand-text {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 28px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text);
      line-height: 1;
      text-shadow: 0 2px 6px rgba(0,0,0,0.5);
      white-space: nowrap;
    }
    .brand-lockup .brand-sub {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 4px;
      color: var(--cyan);
      text-transform: uppercase;
      margin-top: 4px;
      text-shadow: 0 0 8px rgba(56,189,248,0.5);
      white-space: nowrap;
    }

    /* ============= FOOTER (bottom-left) ============= */
    .footer-pill {
      position: absolute;
      left: 50px; bottom: 50px;
      z-index: 8;
      display: flex; align-items: center; gap: 14px;
      padding: 12px 18px;
      background: linear-gradient(155deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 999px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.20),
        0 10px 24px rgba(0,0,0,0.45);
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 4px;
      color: var(--text);
      text-transform: uppercase;
    }
    .footer-pill .social {
      display: flex; align-items: center; gap: 10px;
      color: var(--cyan);
    }
    .footer-pill .social svg { width: 18px; height: 18px; }
    .footer-pill .sep { width: 1px; height: 16px; background: rgba(255,255,255,0.2); }

    /* ============= EDGE FRAME ============= */
    .edge-frame {
      position: absolute; inset: 30px;
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 8px;
      z-index: 7; pointer-events: none;
    }

    .corner-tick {
      position: absolute;
      width: 36px; height: 36px;
      border: 1.5px solid var(--cyan);
      filter: drop-shadow(0 0 8px var(--cyan-glow));
      z-index: 7; pointer-events: none;
    }
    .corner-tick.tl { top: 50px; left: 50px; border-right: none; border-bottom: none; }
    .corner-tick.tr { top: 50px; right: 50px; border-left: none; border-bottom: none; }
  </style>
</head>
<body>
  <div class="canvas">

    <div class="concrete"></div>
    <div class="concrete-streaks"></div>
    <div class="grain"></div>

    <div class="drips">
      <svg viewBox="0 0 1080 220" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="splat" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="0.4"/>
          </filter>
        </defs>
        <g fill="#38BDF8" filter="url(#splat)" opacity="0.85">
          <path d="M 0 0 L 230 0 L 230 110 Q 220 130 210 110 L 200 145 Q 195 165 188 145 L 180 100 Q 168 130 158 100 L 150 130 Q 140 150 130 130 L 122 95 Q 112 130 102 95 L 92 110 Q 80 130 70 110 L 60 90 Q 48 130 36 90 L 28 130 Q 20 150 12 130 L 0 100 Z"/>
          <circle cx="92" cy="155" r="6"/>
          <circle cx="180" cy="170" r="4"/>
          <ellipse cx="40" cy="142" rx="3" ry="6"/>
        </g>
        <g fill="#E8EEF7" filter="url(#splat)" opacity="0.92">
          <path d="M 360 0 L 720 0 L 720 80 Q 710 110 700 80 L 692 130 Q 686 155 678 130 L 668 95 Q 658 130 648 95 L 638 120 Q 628 145 618 120 L 608 90 Q 596 130 584 90 L 574 110 Q 562 135 550 110 L 540 80 Q 528 130 516 80 L 506 100 Q 496 120 488 100 L 480 70 Q 468 110 456 70 L 448 100 Q 438 130 428 100 L 418 75 Q 406 115 394 75 L 386 95 Q 376 115 368 95 L 360 60 Z"/>
          <circle cx="498" cy="150" r="5"/>
          <circle cx="620" cy="158" r="4"/>
          <ellipse cx="572" cy="125" rx="3" ry="5"/>
        </g>
        <g fill="#F39C5B" filter="url(#splat)" opacity="0.9">
          <path d="M 860 0 L 1080 0 L 1080 90 Q 1070 120 1060 90 L 1050 130 Q 1040 155 1030 130 L 1018 90 Q 1006 130 994 90 L 984 110 Q 972 135 960 110 L 950 80 Q 936 130 922 80 L 912 105 Q 900 130 890 105 L 880 75 Q 870 110 860 75 Z"/>
          <circle cx="900" cy="142" r="5"/>
          <circle cx="1024" cy="158" r="4"/>
        </g>
        <g fill="#38BDF8" opacity="0.6">
          <circle cx="270" cy="180" r="3"/>
          <circle cx="320" cy="210" r="2"/>
          <circle cx="770" cy="190" r="3"/>
          <circle cx="820" cy="170" r="2"/>
        </g>
      </svg>
    </div>

    <div class="edge-frame"></div>
    <span class="corner-tick tl"></span>
    <span class="corner-tick tr"></span>

    <div class="stickers">
      <div class="sticker">
        <img src="https://cards.canonniersdequebec.ca/logos/canonniers.png" alt="">
      </div>
      <div class="sticker alt">
        <div class="glyph">C</div>
        <div class="tag">QC · CA</div>
      </div>
      <div class="sticker alt2" style="border-color: rgba(243,156,91,0.45); box-shadow: inset 0 1px 0 rgba(255,255,255,0.30), 0 14px 28px rgba(0,0,0,0.55), 0 0 22px rgba(243,156,91,0.20);">
        <div class="glyph" style="color: var(--orange); text-shadow: 0 0 14px rgba(243,156,91,0.6);">★</div>
      </div>
    </div>

    <div class="cutout-layer">{{{cutouts_html}}}</div>

    <div class="copy">
      <div class="hype-label">
        <span class="bar"></span>
        <span>{{label_game_day}}</span>
        <span class="dot"></span>
      </div>
      <div class="headline">Allez<br>Canonniers<span class="bang">!</span></div>
      <div class="underline-stroke"></div>
      <div class="matchup">Canonniers <span class="vs">VS</span> {{opponent_name}}</div>
      <div class="info-stack">
        {{#if has_venue}}
          <div class="venue">{{venue_name}}</div>
        {{/if}}
        <div class="when">{{date_formatted}} · {{time_formatted}}</div>
      </div>
    </div>

    <div class="footer-pill">
      <span>#GoCanonniers</span>
      <span class="sep"></span>
      <span class="social">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 5.8c-.7.3-1.5.6-2.4.7.8-.5 1.5-1.4 1.8-2.4-.8.5-1.7.8-2.7 1-1.5-1.6-4.1-1.7-5.7-.2-.8.8-1.3 1.9-1.3 3 0 .3 0 .6.1.9-3.2-.2-6-1.7-7.9-4.1-1 1.8-.5 4 1.2 5.1-.6 0-1.2-.2-1.7-.5v.1c0 1.9 1.4 3.5 3.2 3.9-.6.2-1.2.2-1.8.1.5 1.6 2 2.7 3.7 2.7-1.4 1.1-3.1 1.7-4.9 1.7H2c1.8 1.2 4 1.8 6.3 1.8 7.6 0 11.8-6.3 11.8-11.8v-.5c.8-.6 1.5-1.3 2.1-2.1z"/></svg>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.2c3.2 0 3.6 0 4.9.1 1.2.1 1.8.3 2.2.4.6.2 1 .5 1.4.9.4.4.7.8.9 1.4.2.4.4 1 .4 2.2.1 1.2.1 1.6.1 4.8s0 3.6-.1 4.8c-.1 1.2-.3 1.8-.4 2.2-.2.6-.5 1-.9 1.4-.4.4-.8.7-1.4.9-.4.2-1 .4-2.2.4-1.2.1-1.6.1-4.8.1s-3.6 0-4.8-.1c-1.2-.1-1.8-.3-2.2-.4-.6-.2-1-.5-1.4-.9-.4-.4-.7-.8-.9-1.4-.2-.4-.4-1-.4-2.2-.1-1.2-.1-1.6-.1-4.8s0-3.6.1-4.8c.1-1.2.3-1.8.4-2.2.2-.6.5-1 .9-1.4.4-.4.8-.7 1.4-.9.4-.2 1-.4 2.2-.4 1.2-.1 1.6-.1 4.8-.1zm0 5.6c-2.3 0-4.2 1.9-4.2 4.2s1.9 4.2 4.2 4.2 4.2-1.9 4.2-4.2-1.9-4.2-4.2-4.2zm0 6.9c-1.5 0-2.7-1.2-2.7-2.7s1.2-2.7 2.7-2.7 2.7 1.2 2.7 2.7-1.2 2.7-2.7 2.7zm5.4-7c0 .5-.4 1-1 1s-1-.4-1-1 .4-1 1-1 1 .4 1 1z"/></svg>
      </span>
    </div>

    <div class="brand-lockup">
      <img src="https://cards.canonniersdequebec.ca/logos/canonniers.png" alt="Canonniers">
      <div>
        <div class="brand-text">Canonniers</div>
        <div class="brand-sub">DE QUÉBEC</div>
      </div>
    </div>

    <div class="vignette"></div>
  </div>
</body>
</html>
