<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Canonniers — Game Day</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --canvas-w: 1080px;
      --canvas-h: 1080px;

      /* Navy stack */
      --navy-900: #04080F;
      --navy-800: #0A1628;
      --navy-700: #0F1F3A;
      --navy-600: #14294A;
      --navy-500: #1B355F;

      /* Accents */
      --cyan:        #38BDF8;
      --cyan-soft:   rgba(56, 189, 248, 0.55);
      --cyan-glow:   rgba(56, 189, 248, 0.40);
      --platinum:    #E8EEF7;
      --silver:      #B8C4D6;
      --silver-deep: #6B7A93;

      /* Text */
      --text:       #FFFFFF;
      --text-mute:  rgba(232, 238, 247, 0.72);
      --text-faint: rgba(232, 238, 247, 0.48);

      --font-display: 'Barlow Condensed', 'Helvetica Neue', sans-serif;
      --font-mono:    'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100vh;
      background: #05080E;
      font-family: var(--font-display);
      color: var(--text);
      overflow: auto;
      display: grid;
      place-items: center;
    }

    /* Scaling stage so 1080x1080 canvas fits viewport */
    .stage {
      width: 100vmin;
      height: 100vmin;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .canvas {
      width: var(--canvas-w);
      height: var(--canvas-h);
      transform-origin: center center;
      transform: scale(calc(100vmin / 1080));
      position: relative;
      overflow: hidden;
      isolation: isolate;
      /* Deep navy gradient base */
      background:
        radial-gradient(120% 80% at 30% 0%,  rgba(56, 189, 248, 0.10) 0%, transparent 55%),
        radial-gradient(90%  70% at 75% 110%, rgba(20, 41, 74, 0.95)  0%, transparent 65%),
        radial-gradient(140% 100% at 50% 50%, var(--navy-700) 0%, var(--navy-800) 45%, var(--navy-900) 100%);
    }

    /* ---------- Metallic sheen + noise overlays ---------- */
    .sheen {
      position: absolute; inset: 0; z-index: 0; pointer-events: none;
      background:
        /* diagonal brushed-metal streaks */
        repeating-linear-gradient(115deg,
          rgba(255,255,255,0.012) 0px,
          rgba(255,255,255,0.012) 2px,
          rgba(255,255,255,0)     2px,
          rgba(255,255,255,0)     6px),
        /* broad highlight band */
        linear-gradient(118deg,
          transparent 0%,
          transparent 38%,
          rgba(184, 196, 214, 0.05) 50%,
          transparent 62%,
          transparent 100%);
      mix-blend-mode: screen;
    }
    .grain {
      position: absolute; inset: 0; z-index: 0; pointer-events: none;
      opacity: 0.35;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.7  0 0 0 0 0.78  0 0 0 0 0.9  0 0 0 0.6 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    }
    .vignette {
      position: absolute; inset: 0; z-index: 6; pointer-events: none;
      background:
        radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(0,0,0,0.55) 100%);
    }

    /* ---------- Spotlight behind cutout ---------- */
    .spotlight {
      position: absolute;
      left: 52%; top: 18%;
      width: 720px; height: 820px;
      z-index: 1; pointer-events: none;
      background:
        radial-gradient(closest-side,
          rgba(56, 189, 248, 0.32) 0%,
          rgba(56, 189, 248, 0.14) 32%,
          rgba(56, 189, 248, 0.04) 60%,
          transparent 78%);
      filter: blur(8px);
    }
    .spotlight-2 {
      position: absolute;
      left: -10%; top: -8%;
      width: 760px; height: 760px;
      z-index: 0; pointer-events: none;
      background:
        radial-gradient(closest-side,
          rgba(120, 170, 255, 0.10) 0%,
          transparent 70%);
    }

    /* ---------- Field-marking accents (subtle) ---------- */
    .field {
      position: absolute; inset: 0; z-index: 1; pointer-events: none;
      opacity: 0.55;
    }
    .field svg { width: 100%; height: 100%; }

    /* ---------- Brand logo medallion ---------- */
    .brand-logo {
      position: absolute;
      top: 60px; right: 60px;
      width: 120px; height: 120px;
      z-index: 7;
      display: grid; place-items: center;
      border-radius: 999px;
      background:
        radial-gradient(circle at 30% 25%, rgba(255,255,255,0.18), rgba(255,255,255,0.02) 60%),
        linear-gradient(155deg, rgba(56,189,248,0.18), rgba(15,31,58,0.6));
      border: 1px solid rgba(232, 238, 247, 0.22);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.25),
        inset 0 -10px 24px rgba(0,0,0,0.35),
        0 12px 36px rgba(0,0,0,0.55),
        0 0 24px rgba(56,189,248,0.18);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .brand-logo img { width: 78%; height: 78%; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4)); }

    /* ---------- HERO wordmark — chrome ---------- */
    .hero {
      position: absolute;
      left: 0; right: 0;
      top: 360px;
      height: 360px;
      display: flex; align-items: center; justify-content: center;
      z-index: 3;
      pointer-events: none;
    }
    .hero-text {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 244px;
      letter-spacing: -6px;
      line-height: 1;
      white-space: nowrap;
      text-transform: uppercase;

      /* Chrome gradient fill */
      background:
        linear-gradient(180deg,
          #FFFFFF 0%,
          #E8EEF7 22%,
          #B8C4D6 48%,
          #7C8AA3 52%,
          #C8D2E0 70%,
          #FFFFFF 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      /* Layered shadows for depth */
      filter:
        drop-shadow(0 2px 0 rgba(255,255,255,0.20))
        drop-shadow(0 6px 0 rgba(0,0,0,0.35))
        drop-shadow(0 16px 28px rgba(0,0,0,0.55))
        drop-shadow(0 0 36px rgba(56,189,248,0.18));
    }
    /* Outline ghost layer behind the chrome text for extra depth */
    .hero-ghost {
      position: absolute;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 244px;
      letter-spacing: -6px;
      line-height: 1;
      text-transform: uppercase;
      color: transparent;
      -webkit-text-stroke: 2px rgba(56, 189, 248, 0.22);
      transform: translate(0, 0);
      filter: blur(0.4px);
    }

    /* "EST. MMXIV" type ribbon over wordmark */
    .hero-tagline {
      position: absolute;
      top: 326px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
      font-family: var(--font-mono);
      font-size: 13px;
      letter-spacing: 8px;
      color: var(--cyan);
      text-shadow: 0 0 12px rgba(56,189,248,0.55);
      display: flex; align-items: center; gap: 14px;
    }
    .hero-tagline::before, .hero-tagline::after {
      content: ''; display: block; width: 44px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(56,189,248,0.7), transparent);
    }

    /* ---------- INFO PANEL — frosted glass ---------- */
    .info-panel {
      position: absolute;
      left: 60px; top: 280px;
      width: 380px; height: 520px;
      z-index: 5;
      padding: 32px 28px;
      display: flex; flex-direction: column; gap: 18px;

      background:
        linear-gradient(155deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.02) 55%, rgba(56,189,248,0.06) 100%);
      backdrop-filter: blur(22px) saturate(140%);
      -webkit-backdrop-filter: blur(22px) saturate(140%);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 18px;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.35),
        inset 0 -1px 0 rgba(255,255,255,0.06),
        inset 0 0 60px rgba(56,189,248,0.05),
        0 20px 60px rgba(0,0,0,0.45),
        0 0 0 1px rgba(0,0,0,0.4);
    }
    /* highlight sheen across the top of the glass */
    .info-panel::before {
      content: '';
      position: absolute;
      inset: 1px 1px auto 1px;
      height: 40%;
      border-radius: 17px 17px 80% 80% / 17px 17px 100% 100%;
      background: linear-gradient(180deg, rgba(255,255,255,0.12), transparent);
      pointer-events: none;
    }
    /* corner ticks (kept as a subtle ref to original blueprint) */
    .info-panel .tick {
      position: absolute; width: 14px; height: 14px;
      border: 1.5px solid var(--cyan);
      opacity: 0.7;
      filter: drop-shadow(0 0 6px rgba(56,189,248,0.6));
    }
    .info-panel .tick.tl { top: 10px; left: 10px; border-right: none; border-bottom: none; }
    .info-panel .tick.tr { top: 10px; right: 10px; border-left: none; border-bottom: none; }
    .info-panel .tick.bl { bottom: 10px; left: 10px; border-right: none; border-top: none; }
    .info-panel .tick.br { bottom: 10px; right: 10px; border-left: none; border-top: none; }

    .panel-header {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      color: var(--cyan);
      letter-spacing: 4px;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(56,189,248,0.5);
      display: flex; align-items: center; gap: 10px;
    }
    .panel-header::before {
      content: ''; display: block;
      width: 8px; height: 8px;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan);
      transform: rotate(45deg);
    }

    .opponent-block {
      display: flex; gap: 14px; align-items: center;
      padding: 4px 0 2px;
    }
    .opponent-logo-frame {
      width: 72px; height: 72px;
      flex-shrink: 0;
      border-radius: 14px;
      display: grid; place-items: center;
      background:
        radial-gradient(circle at 30% 20%, rgba(255,255,255,0.18), rgba(255,255,255,0.02) 60%),
        linear-gradient(155deg, rgba(255,255,255,0.10), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.22);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.3),
        0 6px 14px rgba(0,0,0,0.35);
    }
    .opponent-logo { width: 54px; height: 54px; object-fit: contain; }

    .opponent-meta { flex: 1; min-width: 0; }
    .vs-label {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-faint);
      letter-spacing: 3px;
      margin-bottom: 4px;
      text-transform: uppercase;
    }
    .opponent-name {
      font-family: var(--font-display);
      font-weight: 700;
      color: var(--text);
      line-height: 1.0;
      text-transform: uppercase;
      letter-spacing: -0.5px;
      word-wrap: break-word;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .opponent-name.tier1 { font-size: 38px; }
    .opponent-name.tier2 { font-size: 30px; }
    .opponent-name.tier3 { font-size: 24px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, rgba(56,189,248,0.55), rgba(56,189,248,0.05));
      width: 100%;
    }

    .when-block { display: flex; flex-direction: column; gap: 6px; }

    .date-label {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-faint);
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .date-text {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 26px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--platinum);
    }
    .time-text {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 56px;
      line-height: 1;
      letter-spacing: -1px;
      background: linear-gradient(180deg, #FFFFFF 0%, #C8D2E0 60%, #8C99B3 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 24px rgba(56,189,248,0.25);
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
      margin-top: 2px;
    }

    .venue-block {
      display: flex; align-items: flex-start; gap: 10px;
      margin-top: auto;
    }
    .venue-icon {
      width: 14px; height: 14px; flex-shrink: 0; margin-top: 4px;
      color: var(--cyan);
      filter: drop-shadow(0 0 6px rgba(56,189,248,0.6));
    }
    .venue-text {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 18px;
      letter-spacing: 0.5px;
      color: var(--text-mute);
      line-height: 1.2;
      text-transform: uppercase;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ---------- Cutout layer with glow ---------- */
    .cutout-layer {
      position: absolute; inset: 0; z-index: 4;
      pointer-events: none;
    }
    .cutout {
      position: absolute;
      filter:
        drop-shadow(0 0 24px rgba(56,189,248,0.55))
        drop-shadow(0 0 60px rgba(56,189,248,0.25))
        drop-shadow(0 24px 40px rgba(0,0,0,0.55));
    }
    /* Demo cutout positioning — bottom-right preset */
    .cutout.demo {
      right: 40px;
      bottom: 60px;
      height: 720px;
      width: auto;
    }

    /* ---------- Bottom bar ---------- */
    .footer-bar {
      position: absolute;
      left: 60px; right: 60px;
      bottom: 60px;
      height: 56px;
      z-index: 6;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 22px;
      background: linear-gradient(90deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.18),
        0 8px 24px rgba(0,0,0,0.4);
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-mute);
      width: 380px;
    }
    .footer-bar .left { color: var(--cyan); text-shadow: 0 0 10px rgba(56,189,248,0.5); }
    .footer-bar .dot {
      display: inline-block; width: 6px; height: 6px; border-radius: 999px;
      background: var(--cyan); margin: 0 10px 1px; vertical-align: middle;
      box-shadow: 0 0 10px var(--cyan);
    }

    /* ---------- Edge frame ---------- */
    .edge-frame {
      position: absolute; inset: 30px;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      z-index: 6; pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="canvas">

      <div class="sheen"></div>
      <div class="grain"></div>
      <div class="spotlight-2"></div>
      <div class="spotlight"></div>

      <div class="field">
        <svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" fill="none">
          <!-- soft arc reminiscent of an outfield wall / horizon -->
          <path d="M -40 880 Q 540 720 1120 880" stroke="rgba(56,189,248,0.18)" stroke-width="1"/>
          <path d="M -40 920 Q 540 780 1120 920" stroke="rgba(56,189,248,0.08)" stroke-width="1"/>
          <!-- compass tick -->
          <circle cx="540" cy="540" r="320" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
        </svg>
      </div>

      <div class="edge-frame"></div>

      <!-- HERO wordmark -->
      <div class="hero-tagline"><span style="width: 200.406px; font-size: 10px; text-align: right">DOUBLE HEADER</span></div>
      <div class="hero">
        <div class="hero-ghost">CANONNIERS</div>
        <div class="hero-text">CANONNIERS</div>
      </div>

      <!-- INFO PANEL -->
      <div class="info-panel">
        <span class="tick tl"></span>
        <span class="tick tr"></span>
        <span class="tick bl"></span>
        <span class="tick br"></span>

        <div class="panel-header">Game Day</div>

        <div class="opponent-block">
          <div class="opponent-logo-frame">
            <img class="opponent-logo" src="assets/test-opponent-logo.png" alt="">
          </div>
          <div class="opponent-meta">
            <div class="vs-label">vs</div>
            <div class="opponent-name tier1">Patriotes</div>
          </div>
        </div>

        <div class="divider"></div>

        <div class="when-block">
          <div class="date-label">Date</div>
          <div class="date-text">Samedi · 24 Mai</div>
          <div class="time-text">19:30</div>
        </div>

        <div class="divider"></div>

        <div class="venue-block">
          <svg class="venue-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/>
          </svg>
          <div class="venue-text">Stade Canonnier · Québec</div>
        </div>
      </div>

      <!-- CUTOUT — drop the real player PNG in here -->
      <div class="cutout-layer">
        <!-- <img class="cutout demo" src="path/to/player.png" alt=""> -->
      </div>

      <!-- FOOTER bar -->
      <div class="footer-bar">
        <span class="left">#GoCanonniers</span>
        <span>QC <span class="dot"></span> CA</span>
      </div>

      <!-- Brand logo medallion -->
      <div class="brand-logo">
        <img src="assets/test-opponent-logo.png" alt="Canonniers">
      </div>

      <div class="vignette"></div>
    </div>
  </div>
</body>
</html>
