name = "canonniers-replays-worker"
main = "index.js"
compatibility_date = "2025-01-01"

# Service binding to spordle-proxy — bypasses the same-account inter-worker
# fetch restriction. Direct fetch() to a *.workers.dev URL on the same account
# returns nothing useful.
[[services]]
binding = "SPORDLE"
service = "spordle-proxy"

# Service binding to canonniers-cards-worker for replay thumbnails. Calls the
# /public/by-game endpoint (no JWT required).
[[services]]
binding = "CARDS"
service = "canonniers-cards-worker"

# No KV, no D1, no R2. Stateless, uses caches.default.
