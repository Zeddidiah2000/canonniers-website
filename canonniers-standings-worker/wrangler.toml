name = "canonniers-standings-worker"
main = "index.js"
compatibility_date = "2025-01-01"

kv_namespaces = [
  { binding = "STANDINGS", id = "c13ca9c975f943218701c5f7761bea4e" }
]

[[services]]
binding = "SPORDLE_PROXY"
service = "spordle-proxy"

[triggers]
# 11:00 / 17:00 / 22:00 / 02:30 UTC  =  07:00 / 13:00 / 18:00 / 22:30 Eastern (EDT)
# 22:00 UTC added 2026-05-27 to catch afternoon-game finishes during tournaments.
crons = ["0 11 * * *", "0 17 * * *", "0 22 * * *", "30 2 * * *"]
